spring.application.name=pokedex
server.port=8080

# Conexão com o MongoDB (nunca coloque usuário/senha aqui).
# Defina a variável de ambiente MONGODB_URI com a URI do Atlas (incluindo o nome do banco, ex.: .../pokedex)
# ou crie o arquivo application-local.properties (ignorado pelo Git) - veja o README.
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/pokedex}
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/pokedex}

# Origem(ns) permitidas pelo CORS (frontend React/Vite)
pokedex.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# Popula o MongoDB com os dados de seed/*.csv (gerados do Script_Pokedex.sql) quando a coleção está vazia
pokedex.seed.enabled=true
